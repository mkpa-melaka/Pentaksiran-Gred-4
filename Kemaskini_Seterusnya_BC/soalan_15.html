<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOM F.I.K.I.R 数学 - 试题 15</title>
<style>
:root{--ink:#1d2433;--muted:#566074;--line:#d5dae3;--bg:#eef3f6;--card:#fff;--accent:#0f5c6e;--accent-soft:#e3f1f4;--ok:#1e7e34;--bad:#c5221f;--warn:#b26a00;--chip:#fff6dc;--chip-b:#d9a93c;--drop:#f3f8fa;--drop-b:#86a7b3}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:16px;line-height:1.35}
.timss{width:100%;max-width:960px;min-height:600px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:stretch;gap:14px;padding:14px;background:var(--bg)}
.interactive-left{flex:1 1 540px;min-width:280px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.question-right{flex:1 1 300px;min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
@media (max-width:720px){.question-right{order:-1}}
.qtag{align-self:flex-start;background:var(--accent);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;padding:5px 10px;border-radius:6px}
.topic{font-size:13px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:10px}
.topic .ms{font-weight:700}
.bi .ms{display:block;font-weight:700}
.bi .en{display:block;font-style:italic;color:var(--muted);font-weight:400;font-size:.93em;margin-top:2px}
.bi.instr{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.95em}
.bi.sub{margin-top:4px}
.bl{display:inline-flex;flex-direction:column;line-height:1.15}
.bl b{font-weight:700}
.bl i{font-style:italic;font-weight:400;color:var(--muted);font-size:.85em}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;min-height:42px;padding:6px 12px;background:var(--chip);border:2px solid var(--chip-b);border-radius:9px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-weight:700;font-size:18px;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08);font-family:Arial,Helvetica,sans-serif}
.chip:hover{border-color:#b8861b}
.chip.locked{cursor:default;background:#e9eef2;border-color:#9aa8b3}
.chip-ph{flex:none;border:2px dashed #d9cfa8;border-radius:9px;background:rgba(255,246,220,.45)}
.chip.dragging{position:fixed;z-index:1000;pointer-events:none;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.28);margin:0;transform:scale(1.04)}
.drop{min-height:54px;min-width:86px;border:2px dashed var(--drop-b);border-radius:10px;background:var(--drop);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:6px;transition:background .15s,border-color .15s}
.drop.hover{background:#d6eef4;border-color:var(--accent);border-style:solid}
.tray{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:10px;background:#fafbfc;border:1px solid var(--line);min-height:62px;align-items:center}
.tray-label{font-size:13px;margin-bottom:-6px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opt{display:inline-flex;width:22px;height:22px;border-radius:50%;border:1.5px solid #333;font-size:12px;align-items:center;justify-content:center;font-weight:700;background:#fff;flex:none}
.frac-wrap{display:inline-flex;align-items:center;gap:3px}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-size:.92em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.actions{margin-top:auto;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.btn{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;border-radius:10px;padding:8px 18px;font-family:inherit;font-size:15px;cursor:pointer;border:2px solid var(--accent)}
.btn b{font-weight:700}.btn i{font-size:.8em;font-weight:400}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#0b4a59}
.btn[hidden]{display:none}
.btn.next{background:#f2b705;border-color:#d9a400;color:#1d2433;text-decoration:none}
.btn.next:hover{background:#ffcb2e}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(16,28,38,.5);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px}
.modal[hidden]{display:none}
.m-box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:24px 22px 20px;text-align:center;border-top:10px solid var(--accent);box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal.ok .m-box{border-color:var(--ok)}.modal.bad .m-box{border-color:var(--bad)}.modal.empty .m-box{border-color:var(--warn)}
.m-icon{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:700}
.modal.ok .m-icon{background:var(--ok)}.modal.bad .m-icon{background:var(--bad)}.modal.empty .m-icon{background:var(--warn)}
.m-title .ms{display:block;font-size:22px;font-weight:700}
.m-title .en{display:block;font-style:italic;color:var(--muted);font-size:16px;margin-bottom:10px}
.m-body .ms{display:block;font-weight:700;margin-top:6px}
.m-body .en{display:block;font-style:italic;color:var(--muted);font-size:.93em}
.m-box .btn{margin-top:16px}
table.data{border-collapse:collapse;font-size:15px}
table.data th,table.data td{border:1px solid #9aa6b2;padding:6px 10px;text-align:center}
table.data th{background:#eef3f6}
svg text{font-family:Arial,Helvetica,sans-serif}
.interactive-left svg{-webkit-user-select:none;user-select:none}
.readout{font-size:15px;background:#fff8e6;border:1px solid #edd38a;border-radius:8px;padding:6px 10px;display:inline-flex;gap:10px;align-items:center}
.readout .val{font-size:22px;font-weight:700;color:var(--accent)}
.choice{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:16px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.choice.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice i{font-size:.8em;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;cursor:pointer}
.panel{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fcfdfe}
.panel-h{font-size:14px;margin-bottom:6px}


html,body,.chip,.btn,.choice{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",Arial,sans-serif}
svg text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.bi .ms{font-weight:400}
.bi.qtext .ms{font-size:1.08em;line-height:1.65}
.topic .ms{font-weight:700}
.bi.instr .ms{line-height:1.6}
.btn{padding:10px 20px;font-size:16px}

.graph{position:relative}.gd{position:absolute;left:1%;width:17%;min-width:54px;min-height:40px;transform:translateY(-50%);padding:2px}.gd .chip{min-height:32px;padding:2px 8px}#nt .chip{min-width:42px}
</style>
</head>
<body>
<div class="timss" id="timss">
  <section class="interactive-left" aria-label="作答区">

    <div class="row" style="align-items:flex-start">
      <div style="flex:0 0 auto"><table class="data"><tr><th><span class="bl "><b>星期</b></span></th><th><span class="bl "><b>汽车数量</b></span></th></tr><tr><td style="text-align:left"><span class="bl "><b>星期一</b></span></td><td>8</td></tr><tr><td style="text-align:left"><span class="bl "><b>星期二</b></span></td><td>5</td></tr><tr><td style="text-align:left"><span class="bl "><b>星期三</b></span></td><td>7</td></tr><tr><td style="text-align:left"><span class="bl "><b>星期四</b></span></td><td>10</td></tr><tr><td style="text-align:left"><span class="bl "><b>星期五</b></span></td><td>12</td></tr></table></div>
      <div style="flex:1 1 200px"><span class="bl tray-label"><b>数字卡</b></span><div class="tray" id="nt" style="margin-top:8px"><div class="chip" data-clone="1" data-val="1">1</div><div class="chip" data-clone="1" data-val="2">2</div><div class="chip" data-clone="1" data-val="3">3</div><div class="chip" data-clone="1" data-val="4">4</div><div class="chip" data-clone="1" data-val="5">5</div><div class="chip" data-clone="1" data-val="6">6</div><div class="chip" data-clone="1" data-val="8">8</div><div class="chip" data-clone="1" data-val="10">10</div><div class="chip" data-clone="1" data-val="12">12</div><div class="chip" data-clone="1" data-val="15">15</div><div class="chip" data-clone="1" data-val="20">20</div></div></div>
    </div>
    <div class="panel"><div class="graph"><svg viewBox="0 0 480 340" width="100%" style="display:block">
<text x="285" y="32" text-anchor="middle" font-size="17" font-weight="700">汽车数量</text>
<line x1="100" y1="205" x2="470" y2="205" stroke="#c7ccd6"/><line x1="100" y1="130" x2="470" y2="130" stroke="#c7ccd6"/><line x1="100" y1="55" x2="470" y2="55" stroke="#c7ccd6"/><line x1="100" y1="280" x2="470" y2="280" stroke="#555" stroke-width="1.5"/><rect x="127" y="160" width="26" height="120" fill="#0b7fa5"/><text x="140" y="300" text-anchor="middle" font-size="13" font-weight="700">星期一</text><rect x="199" y="205" width="26" height="75" fill="#0b7fa5"/><text x="212" y="300" text-anchor="middle" font-size="13" font-weight="700">星期二</text><rect x="271" y="175" width="26" height="105" fill="#0b7fa5"/><text x="284" y="300" text-anchor="middle" font-size="13" font-weight="700">星期三</text><rect x="343" y="130" width="26" height="150" fill="#0b7fa5"/><text x="356" y="300" text-anchor="middle" font-size="13" font-weight="700">星期四</text><rect x="415" y="100" width="26" height="180" fill="#0b7fa5"/><text x="428" y="300" text-anchor="middle" font-size="13" font-weight="700">星期五</text>
<text x="88" y="285" text-anchor="end" font-size="15" font-weight="700">0</text></svg><div class="drop gd" id="y5" style="top:60.29%"></div><div class="drop gd" id="y10" style="top:38.24%"></div><div class="drop gd" id="y15" style="top:16.18%"></div></div></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="btnReset"><b>重新开始</b></button>
      <button type="button" class="btn primary" id="btnCheck"><b>检查答案</b></button>
      <a class="btn next" id="btnNext" href="index.html"><b>继续 &rarr;</b></a>
    </div>
  </section>
  <section class="question-right" aria-label="试题">
    <div class="qtag">试题 15</div>
    <div class="bi topic"><span class="ms">数据：绘制条形统计图（刻度）</span></div>
<div class="bi qtext"><span class="ms">斯凯拉记录了每天早上经过她家街道的汽车数量。她开始根据这些数据制作条形统计图。<br><br>斯凯拉应该填入什么数目标记条形统计图的水平线？</span></div>
<div class="bi instr"><span class="ms">把数字卡拖到统计图左边的三个空格里。每个空格标记一条水平线。</span></div>
  </section>
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true">
    <div class="m-box">
      <div class="m-icon"></div>
      <div class="m-title"></div>
      <div class="m-body"></div>
      <button type="button" class="btn primary m-close"><b>关闭</b></button>
    </div>
  </div>
</div>
<script>window.I18N={mono:true,tt:{ok:['答对了！很棒！','','✔'],bad:['还不正确，再试一次。','','✖'],empty:['答案还没完成。','','!']},empty:['请先完成所有答题空格。','']};</script>
<script>
(function(){
const R=document.getElementById('timss');
let uid=0;const gid=el=>el.id||(el.id='z'+(++uid));
let ord=0;
R.querySelectorAll('.chip').forEach(c=>{c.dataset.ord=ord++;if(c.dataset.clone!=='1'&&!c.classList.contains('locked'))c.dataset.home=gid(c.parentElement);});
let D=null;
function zoneAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;return el.closest('.drop')||el.closest('.tray');}
function clearHover(){R.querySelectorAll('.drop.hover').forEach(z=>z.classList.remove('hover'));}
function settle(el){el.classList.remove('dragging');el.style.left='';el.style.top='';el.style.width='';}
function sortHome(h){[...h.children].filter(c=>c.classList.contains('chip')).sort((a,b)=>a.dataset.ord-b.dataset.ord).forEach(c=>h.appendChild(c));}
function home(el){settle(el);if(el.dataset.temp==='1'){el.remove();return;}const h=document.getElementById(el.dataset.home);if(h){h.appendChild(el);sortHome(h);}}
function place(el,z){settle(el);const max=+(z.dataset.max||1);const cur=[...z.children].filter(c=>c.classList.contains('chip')&&!c.classList.contains('locked'));if(cur.length>=max)home(cur[0]);z.appendChild(el);}
function changed(){R.dispatchEvent(new Event('dndchange'));}
R.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip');if(!c||c.classList.contains('locked'))return;
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  const r=c.getBoundingClientRect();let el=c;
  if(c.dataset.clone==='1'){el=c.cloneNode(true);el.dataset.clone='0';el.dataset.temp='1';el.removeAttribute('id');}
  let ph=null;if(el===c){ph=document.createElement('div');ph.className='chip-ph';ph.style.width=r.width+'px';ph.style.height=r.height+'px';c.parentNode.insertBefore(ph,c);}
  D={el,ph,dx:e.clientX-r.left,dy:e.clientY-r.top};
  el.style.width=r.width+'px';el.classList.add('dragging');document.body.appendChild(el);mv(e);
});
function mv(e){if(!D)return;D.el.style.left=(e.clientX-D.dx)+'px';D.el.style.top=(e.clientY-D.dy)+'px';clearHover();const z=zoneAt(e.clientX,e.clientY);if(z&&z.classList.contains('drop'))z.classList.add('hover');}
window.addEventListener('pointermove',mv);
window.addEventListener('pointerup',e=>{if(!D)return;const el=D.el;const z=zoneAt(e.clientX,e.clientY);if(D.ph)D.ph.remove();D=null;clearHover();if(z&&z.classList.contains('drop')&&R.contains(z))place(el,z);else home(el);changed();});
window.addEventListener('pointercancel',()=>{if(!D)return;const el=D.el;if(D.ph)D.ph.remove();D=null;clearHover();home(el);changed();});
window.Q={R,
  vals:s=>{const z=R.querySelector(s);return z?[...z.children].filter(c=>c.classList.contains('chip')).map(c=>c.dataset.val):[];},
  place:(val,s)=>{const src=[...R.querySelectorAll('.chip')].find(c=>c.dataset.val===val&&!c.classList.contains('locked')&&(c.dataset.clone==='1'||!c.closest('.drop')));if(!src)return;let el=src;if(src.dataset.clone==='1'){el=src.cloneNode(true);el.dataset.clone='0';el.dataset.temp='1';el.removeAttribute('id');}place(el,R.querySelector(s));changed();},
  reset(){R.querySelectorAll('.chip').forEach(c=>{if(c.classList.contains('locked'))return;if(c.dataset.temp==='1'){c.remove();return;}const h=document.getElementById(c.dataset.home);if(h&&c.parentElement!==h)h.appendChild(c);});R.querySelectorAll('[id]').forEach(h=>sortHome(h));changed();},
  changed
};
const M=document.getElementById('modal');
const I=window.I18N,TT=I.tt;
function show(r){r=r||{state:'empty'};const t=TT[r.state];M.className='modal '+r.state;
  M.querySelector('.m-icon').textContent=t[2];
  const sp=(a,b)=>'<span class="ms">'+a+'</span>'+(b&&!I.mono?'<span class="en">'+b+'</span>':'');
  M.querySelector('.m-title').innerHTML=sp(t[0],t[1]);
  let ms=r.ms,en=r.en;if(!ms&&r.state==='empty'){ms=I.empty[0];en=I.empty[1];}
  M.querySelector('.m-body').innerHTML=ms?sp(ms,en):'';
  M.hidden=false;M.querySelector('.m-close').focus();}
window.Q.show=show;
(function(){const h=location.hostname||'';if(location.protocol==='about:'||location.protocol==='data:'||/googleusercontent\.com$|sites\.google\.com$|claudeusercontent|claude\.ai$/.test(h)){const n=document.getElementById('btnNext');if(n)n.hidden=true;}})();
document.getElementById('btnCheck').addEventListener('click',()=>{const r=window.qCheck?window.qCheck():{state:'empty'};if(r.state==='ok'&&window.qOnCorrect)window.qOnCorrect();if(r.state!=='ok'&&window.qOnWrong)window.qOnWrong();show(r);});
document.getElementById('btnReset').addEventListener('click',()=>{Q.reset();if(window.qReset)window.qReset();changed();});
M.querySelector('.m-close').addEventListener('click',()=>{M.hidden=true;});
M.addEventListener('click',e=>{if(e.target===M)M.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')M.hidden=true;});
})();
</script>
<script>

window.qCheck=()=>{const v=[5,10,15].map(k=>Q.vals('#y'+k)[0]);if(v.some(x=>x===undefined))return{state:'empty'};
 if(v.join()==='5,10,15')return{state:'ok',ms:'星期二的长条（5）刚好到第一条线，星期四的长条（10）刚好到第二条线。所以水平线是 5、10 和 15。',en:'The Tuesday bar (5) reaches the first line exactly and the Thursday bar (10) reaches the second line. So the lines are 5, 10 and 15.'};
 return{state:'bad',ms:'找出刚好到达一条线的长条，再用表格里它的数值。',en:'Find a bar that ends exactly on a line. Use its value from the table.'};};

</script>
</body>
</html>
